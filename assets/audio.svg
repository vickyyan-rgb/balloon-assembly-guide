<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img"><title>XIAO 到 I²S 功放与喇叭的信号图</title><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="900" height="550" rx="14" fill="#f1f6fa" stroke="none" stroke-width="2"/><text x="46" y="68" font-size="36" fill="#223650" font-weight="700">主板、功放、喇叭</text><text x="46" y="111" font-size="23" fill="#223650" font-weight="500">按焊盘名称逐根接线。图中排列只表示连接关系。</text><rect x="44" y="170" width="222" height="255" rx="14" fill="#dce9f5" stroke="none" stroke-width="2"/><text x="70" y="218" font-size="24" fill="#223650" font-weight="700">XIAO ESP32-S3</text><rect x="410" y="170" width="193" height="255" rx="14" fill="#e3def3" stroke="none" stroke-width="2"/><text x="427" y="218" font-size="25" fill="#223650" font-weight="700">MAX98357A</text><rect x="725" y="210" width="135" height="181" rx="14" fill="#e0eae2" stroke="none" stroke-width="2"/><text x="747" y="251" font-size="22" fill="#223650" font-weight="700">8 Ω 喇叭</text><text x="68" y="275" font-size="23" fill="#223650" font-weight="500">D8 / GPIO7</text><path d="M268 267 L408 267" stroke="#5169ae" stroke-width="4" fill="none"/><circle cx="268" cy="267" r="5" fill="#5169ae"/><circle cx="408" cy="267" r="5" fill="#5169ae"/><text x="429" y="275" font-size="21" fill="#223650" font-weight="500">BCLK</text><text x="68" y="328" font-size="23" fill="#223650" font-weight="500">D9 / GPIO8</text><path d="M268 320 L408 320" stroke="#5169ae" stroke-width="4" fill="none"/><circle cx="268" cy="320" r="5" fill="#5169ae"/><circle cx="408" cy="320" r="5" fill="#5169ae"/><text x="429" y="328" font-size="21" fill="#223650" font-weight="500">LRC / WS</text><text x="68" y="381" font-size="23" fill="#223650" font-weight="500">D10 / GPIO9</text><path d="M268 373 L408 373" stroke="#5169ae" stroke-width="4" fill="none"/><circle cx="268" cy="373" r="5" fill="#5169ae"/><circle cx="408" cy="373" r="5" fill="#5169ae"/><text x="429" y="381" font-size="21" fill="#223650" font-weight="500">DIN</text><text x="549" y="293" font-size="17" fill="#223650" font-weight="500">SPK+</text><path d="M603 287 L723 287" stroke="#a15c4c" stroke-width="4" fill="none"/><circle cx="603" cy="287" r="5" fill="#a15c4c"/><circle cx="723" cy="287" r="5" fill="#a15c4c"/><text x="765" y="293" font-size="24" fill="#223650" font-weight="700">+</text><text x="549" y="356" font-size="17" fill="#223650" font-weight="500">SPK−</text><path d="M603 350 L723 350" stroke="#4b6575" stroke-width="4" fill="none"/><circle cx="603" cy="350" r="5" fill="#4b6575"/><circle cx="723" cy="350" r="5" fill="#4b6575"/><text x="765" y="356" font-size="24" fill="#223650" font-weight="700">−</text><text x="48" y="496" font-size="22" fill="#223650" font-weight="500">SPK− 是功放输出的一端。喇叭两根线都接功放的输出端。</text></g></svg>